<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2F7DE1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>หนอกับคิดถึง English</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Mitr:wght@400;500;600&family=Mali:wght@400;600&display=swap">
<style>
/* Layout: one-column "school notebook" app, big tap targets for a tablet; each child has their own color */
:root{
  --bg:#EAF4FF; --paper:#FFFFFF; --ink:#17233D; --muted:#5B6B88; --line:#C9DBF2; --grid:#DCE9F8;
  --sun:#FFB627; --sunInk:#4A3000; --nor:#F2604B; --kid:#1E9C72;
  --ok:#1B8F52; --bad:#D8443A; --okbg:#DDF6E7; --badbg:#FDE3E0; --lock:#B8C6DB;
  --f-display:"Mitr","Mali",system-ui,sans-serif;
  --f-body:"Mali","Mitr",system-ui,sans-serif;
  --f-en:"Andika","Mali",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1729; --paper:#17233B; --ink:#E9F0FB; --muted:#9AAAC6; --line:#2C3D5E; --grid:#16223A;
  --sun:#FFC24D; --sunInk:#2A1C00; --nor:#FF8A78; --kid:#3CC898;
  --ok:#4CCB84; --bad:#FF7468; --okbg:#143A27; --badbg:#45201D; --lock:#3A4A68; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1729; --paper:#17233B; --ink:#E9F0FB; --muted:#9AAAC6; --line:#2C3D5E; --grid:#16223A;
  --sun:#FFC24D; --sunInk:#2A1C00; --nor:#FF8A78; --kid:#3CC898;
  --ok:#4CCB84; --bad:#FF7468; --okbg:#143A27; --badbg:#45201D; --lock:#3A4A68; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;min-height:100vh}
.app{max-width:760px;margin:0 auto;padding-block:16px 120px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;line-height:1.25}
h1{font-size:clamp(28px,6vw,40px)} h2{font-size:24px} h3{font-size:19px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.muted{color:var(--muted)}
.en{font-family:var(--f-en)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:10px 22px;border-radius:16px;
  font-family:var(--f-display);font-size:19px;font-weight:500;background:var(--paper);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.main{background:var(--sun);color:var(--sunInk);border-color:var(--sun);box-shadow:0 4px 0 color-mix(in srgb,var(--sun) 60%,#000)}
.btn.small{min-height:44px;font-size:16px;padding:6px 14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.back{font-family:var(--f-display);font-size:17px;color:var(--muted);min-height:44px;padding:0 6px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:var(--paper);border:2px solid var(--line);font-family:var(--f-display);font-size:15px;white-space:nowrap}

/* home */
.hero{text-align:center;padding:12px 0 6px}
.hero p{margin:6px 0 0}
.kids{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:20px}
.kidbtn{background:var(--paper);border:3px solid var(--c);border-radius:24px;padding:22px 16px;display:flex;flex-direction:column;align-items:center;gap:6px;
  box-shadow:0 6px 0 var(--c);transition:transform .08s}
.kidbtn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--c)}
.kidbtn .ava{font-size:72px;line-height:1}
.kidbtn .nm{font-family:var(--f-display);font-size:28px;font-weight:600;color:var(--c)}
.parent{margin:28px auto 0;display:flex;justify-content:center}
.status{font-size:14px;text-align:center;margin-top:14px}

/* lesson map */
.path{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.lesson{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:120px}
.lesson .no{font-family:var(--f-display);font-size:20px;font-weight:600}
.lesson .pv{font-family:var(--f-en);font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lesson .st{margin-top:auto;font-size:15px;font-family:var(--f-display)}
.lesson.open{border-color:var(--c);box-shadow:0 4px 0 var(--c)}
.lesson.done{border-color:var(--ok)}
.lesson.locked{opacity:.6;background:transparent;border-style:dashed}
.lesson.done .st{color:var(--ok)}

/* words */
.sec{display:flex;flex-direction:column;gap:10px}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.word{background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.word .em{font-size:38px;line-height:1.2}
.word .w{font-family:var(--f-en);font-size:21px;font-weight:700}
.word .t{font-size:15px;color:var(--muted)}
.tag{font-family:var(--f-display);font-size:14px;padding:2px 10px;border-radius:999px;background:var(--c);color:#fff}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:2px solid var(--line);
  padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:5}
.bar .in{max-width:760px;margin:0 auto;display:flex;gap:10px;flex-wrap:wrap}
.bar .btn{flex:1 1 160px}

/* flashcard */
.flash{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:28px 18px}
.flash .em{font-size:110px;line-height:1.1}
.flash .w{font-family:var(--f-en);font-size:clamp(40px,10vw,60px);font-weight:700;line-height:1.1}
.flash .t{font-size:26px;color:var(--muted)}
.speak{width:72px;height:72px;border-radius:50%;background:var(--sun);color:var(--sunInk);font-size:34px;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 4px 0 color-mix(in srgb,var(--sun) 60%,#000)}
.speak:active{transform:translateY(3px);box-shadow:none}
.progress{height:12px;background:var(--line);border-radius:99px;overflow:hidden;flex:1;min-width:120px}
.progress i{display:block;height:100%;background:var(--c);border-radius:99px;transition:width .3s}

/* quiz */
.q{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:18px 12px}
.q .ask{font-family:var(--f-display);font-size:18px;color:var(--muted)}
.q .big{font-size:clamp(34px,8vw,52px);font-weight:700;line-height:1.15}
.q .emo{font-size:90px;line-height:1.1}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.opt{min-height:84px;border-radius:18px;background:var(--paper);border:3px solid var(--line);font-size:24px;padding:8px;box-shadow:0 4px 0 var(--line)}
.opt.emo{font-size:56px}
.opt.en{font-family:var(--f-en);font-weight:700;font-size:26px}
.opt.right{background:var(--okbg);border-color:var(--ok);box-shadow:0 4px 0 var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad);box-shadow:0 4px 0 var(--bad)}
.slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;min-height:62px}
.slot{width:50px;height:58px;border-radius:12px;border:3px dashed var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--f-en);font-size:32px;font-weight:700;background:var(--paper)}
.slot.f{border-style:solid;border-color:var(--c)}
.tiles{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.tile{width:56px;height:60px;border-radius:14px;background:var(--sun);color:var(--sunInk);font-family:var(--f-en);font-size:32px;font-weight:700;box-shadow:0 4px 0 color-mix(in srgb,var(--sun) 60%,#000)}
.tile.used{visibility:hidden}
.feedback{font-family:var(--f-display);font-size:22px;min-height:34px}
.speak.sm{width:52px;height:52px;font-size:24px}
.sent-th{font-size:20px;color:var(--muted);margin-top:-4px}
.example{margin-top:14px;padding:14px 16px;border-radius:16px;background:var(--bg);width:100%;max-width:520px;display:flex;flex-direction:column;gap:6px}
.ex-label{font-family:var(--f-display);font-size:14px;color:var(--muted)}
.ex-en{font-size:clamp(24px,5.5vw,32px);font-weight:700;line-height:1.3}
.ex-en u{text-decoration-color:var(--sun);text-decoration-thickness:4px;text-underline-offset:5px}
.ex-th{font-size:19px;color:var(--muted)}
.sent{font-size:clamp(26px,6.5vw,38px);font-weight:700;line-height:1.3}
.sent u{text-decoration-color:var(--sun);text-decoration-thickness:5px;text-underline-offset:6px}
.blank{display:inline-block;width:3.2em;height:.9em;border-bottom:5px solid var(--c);vertical-align:baseline}
.feedback.ok{color:var(--ok)} .feedback.no{color:var(--bad)}

/* result */
.result{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 16px}
.result .score{font-family:var(--f-display);font-size:72px;font-weight:600;line-height:1}
.result .stars{font-size:52px;letter-spacing:6px}
.missed{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--paper);border:2px solid var(--line);font-size:16px}
.chip b{font-family:var(--f-en)}

/* dashboard */
.dash-kid{border-top:6px solid var(--c)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin:14px 0}
.stat{background:var(--bg);border-radius:14px;padding:10px 12px}
.stat .v{font-family:var(--f-display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .l{font-size:14px;color:var(--muted)}
.chartwrap{overflow-x:auto}
.chartwrap svg{display:block;width:100%;min-width:420px;height:auto}
table{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}
th{font-family:var(--f-display);font-weight:500;color:var(--muted);font-size:14px}
.tblwrap{overflow-x:auto}
.okt{color:var(--ok);font-weight:600} .badt{color:var(--bad);font-weight:600}
.switch{display:flex;gap:12px;align-items:center;cursor:pointer}
.switch input{width:26px;height:26px;accent-color:var(--kid)}
input.num{font:inherit;font-size:28px;width:140px;padding:8px 12px;border-radius:14px;border:2px solid var(--line);background:var(--paper);color:var(--ink);text-align:center}
.installbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:16px;border-color:var(--sun);background:color-mix(in srgb,var(--sun) 14%,var(--paper))}
.installbar .ic{font-size:40px;line-height:1}
.installbar .tx{flex:1 1 200px;min-width:0}
.installbar b{font-family:var(--f-display);font-size:20px;font-weight:500}
a.btn{text-decoration:none;color:inherit}
a.btn.main{color:var(--sunInk)}
.steps{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:10px;font-size:18px}
.link{font-family:var(--f-en);font-size:15px;background:var(--bg);padding:8px 12px;border-radius:10px;word-break:break-all;min-width:0;flex:1 1 200px;user-select:all}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px;border-color:var(--c)}
.banner.wk{border-color:var(--sun);background:color-mix(in srgb,var(--sun) 14%,var(--paper))}
.banner b{font-family:var(--f-display);font-size:18px;font-weight:500}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:14px;font-family:var(--f-display);z-index:20;max-width:calc(100% - 32px)}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .35s ease-out}
@media (prefers-reduced-motion:reduce){.pop{animation:none}.progress i{transition:none}}
@media (max-width:420px){.opt{font-size:20px;min-height:76px}.opt.en{font-size:22px}.tile{width:48px;height:54px;font-size:28px}.slot{width:42px;height:52px;font-size:28px}}
</style>

function sentenceFor(w){
  const p=PHR[w.en];if(p)return {en:p[0],th:p[1]};
  if(LIKE.has(w.en))return {en:"I like ___.",th:"ฉันชอบ"+w.th};
  if(GOTO.has(w.en))return {en:"Let's go to the ___.",th:"ไป"+w.th+"กันเถอะ"};
  if(COLORS.has(w.en)&&w.th.startsWith("สี"))return {en:"My bag is ___.",th:"กระเป๋าของฉัน"+w.th};
  let h=0;for(const ch of w.en)h=(h*31+ch.charCodeAt(0))|0;
  return (h&1)?{en:"Look at the ___.",th:"ดู"+w.th+"สิ"}:{en:"I see the ___.",th:"ฉันเห็น"+w.th};
}

let enVoice=null, ttsCap=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();enVoice=vs.find(v=>/en[-_]US/i.test(v.lang)&&/samantha|google|female|aria|jenny/i.test(v.name))||vs.find(v=>/en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null}catch(e){}}
try{if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}}catch(e){}
function say(text){
  try{
    if("speechSynthesis" in window){
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=0.8;if(enVoice)u.voice=enVoice;
      speechSynthesis.speak(u);return;
    }
  }catch(e){}
  if(ttsCap)ttsCap.speak(text,{language:"en",rate:0.8}).catch(()=>{});
}
let actx=null;
function beep(ok){
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const notes=ok?[660,880]:[300,220];
    notes.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type=ok?"triangle":"square";o.frequency.value=f;
      const t=actx.currentTime+i*0.12;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(ok?0.25:0.12,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);
      o.connect(g).connect(actx.destination);o.start(t);o.stop(t+0.22)});
  }catch(e){}
}

  if(o.last!=null&&typeof o.last!=="number")o.last=null;return o}

function localSave(){try{localStorage.setItem(LKEY,JSON.stringify({nor:kids.nor,kid:kids.kid,settings}))}catch(e){}}
const queue={};
function writeDoc(path,body){
  if(mode!=="online"){localSave();return}
  const data=JSON.parse(JSON.stringify(body));
  queue[path]=(queue[path]||Promise.resolve()).then(()=>DB.doc(path).set(data)).catch(e=>{
    toast(e&&e.code==="invalid_argument"?"บัญชีนี้บันทึกผลไม่ได้ ให้คุณพ่อเพิ่มสิทธิ์ Contributor":"บันทึกไม่สำเร็จ ตรวจอินเทอร์เน็ตแล้วลองใหม่");
  });
  localSave();
}
async function initStore(){
  localLoad();
  const fallback=setTimeout(()=>{if(mode==="loading"){mode="local";render()}},10000);
  let db=null;
  try{db=window.claude&&window.claude.use?await window.claude.use("db"):null}catch(e){db=null}
  try{ttsCap=window.claude&&window.claude.use?await window.claude.use("tts"):null}catch(e){}
  if(!db){clearTimeout(fallback);mode="local";render();return}
  DB=db;
  let pending=3;
  const done=()=>{if(--pending===0&&mode==="loading"){clearTimeout(fallback);mode="online";render()}};
  KIDS.forEach(k=>{
    let first=true;
    db.doc("kids/"+k.id).onSnapshot(s=>{
      if(!view.busy){kids[k.id]=s.exists?norm(s.data()):blank()}else{view.pendingSnap=true;view.snaps=view.snaps||{};view.snaps[k.id]=s.exists?norm(s.data()):blank()}
      if(first&&!s.metadata.fromCache){first=false;mode=mode==="local"?"online":mode;done()}
      if(mode==="online")refresh();
    },e=>{toast("เชื่อมต่อข้อมูลออนไลน์ไม่ได้ ใช้การบันทึกในเครื่องแทน");if(mode!=="online"){mode="local";render()}});
  });
  let firstS=true;
  db.doc("settings/main").onSnapshot(s=>{
    settings={dailyLimit:!!(s.exists&&s.data().dailyLimit)};
    if(firstS&&!s.metadata.fromCache){firstS=false;done()}
    if(mode==="online")refresh();
  },()=>{});
}

/* ---------- progress helpers ---------- */
/* สอบรอบยอดทุกวันเสาร์: ถ้ายังไม่ผ่าน จะเรียนบทใหม่ไม่ได้ (ทบทวนบทเดิมได้) */
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
function satKey(){const d=new Date();d.setDate(d.getDate()-((d.getDay()+1)%7));return ymd(d)}
function weekStart(key){const [y,m,dd]=key.split("-").map(Number);return ymd(new Date(y,m-1,dd-6))}
function weeklyDue(k){const key=satKey();const w=k.weekly[key];if(w&&w.passed)return null;return Object.values(k.passed).some(p=>p<=key)?key:null}
function passedWords(k){return Object.keys(k.passed).map(Number).filter(i=>i>=0&&i<NL).sort((a,b)=>a-b).flatMap(lessonWords)}
function weeklyPick(k,key,pool){
  const ws=weekStart(key);
  const recent=shuffle(pool.filter(w=>{const p=k.passed[w.l];return p>=ws&&p<=key}));
  const missed=pool.filter(w=>k.missed[w.en]).sort((a,b)=>(+k.missed[b.en]||0)-(+k.missed[a.en]||0));
  const out=[],seen=new Set();
  const take=(arr,max)=>{for(const w of arr){if(out.length>=max)break;if(!seen.has(w)){seen.add(w);out.push(w)}}};
  take(recent,18);take(missed,26);take(shuffle(pool),30);
  return shuffle(out);
}
function baseUnlocked(k,i){if(i===0)return true;const p=k.passed[i-1];if(!p)return false;return !settings.dailyLimit||p<today()}
function unlocked(k,i){if(k.passed[i])return true;if(weeklyDue(k))return false;return baseUnlocked(k,i)}
function lessonState(k,i){if(k.passed[i])return "done";if(baseUnlocked(k,i))return weeklyDue(k)?"weekly":"open";if(k.passed[i-1])return "tomorrow";return "locked"}
function resumeText(r){return (r.weekly?"สอบรอบยอด":(r.practice?"การฝึก":"ข้อสอบ")+" บทที่ "+(r.i+1))+" ทำไปแล้ว "+r.n+"/"+r.qs.length+" ข้อ"}
const starsFor=p=>p>=100?3:p>=90?2:p>=PASS?1:0;
const totalStars=k=>Object.values(k.stars).reduce((a,b)=>a+(+b||0),0);
function streak(k){const set=new Set(k.days);let d=new Date();if(!set.has(today()))d.setDate(d.getDate()-1);let n=0;
  while(set.has(d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()))){n++;d.setDate(d.getDate()-1)}return n}
const kidById=id=>KIDS.find(k=>k.id===id);

/* ---------- quiz ---------- */
const WK=w=>w.cat+"|"+w.en;
const WMAP=new Map();
LESSONS.forEach((L,i)=>[...L.verbs,...L.home,...L.school].forEach(w=>{w.l=i;WMAP.set(WK(w),w)}));
function canSpell(w){return /^[a-z]+$/.test(w.en)&&w.en.length<=10}
// ข้อสอบและการฝึกใช้ 2 แบบ: อ่านประโยคเติมคำ กับ เรียงตัวอักษรสะกดคำ
function makeQuiz(pool,pick){
  const types=["sentence","spell"];
  let rot=shuffle(types),ri=0;
  return pick.map(w=>{
    let t=rot[ri++%rot.length];
    if(ri%rot.length===0)rot=shuffle(types);
    if(t==="spell"&&!canSpell(w))t="sentence";
    const cand=pool.filter(x=>x!==w&&x.th!==w.th&&x.em!==w.em&&x.en!==w.en);
    const same=shuffle(cand.filter(x=>x.cat===w.cat)), other=shuffle(cand.filter(x=>x.cat!==w.cat));
    const opts=shuffle([w,...[...same,...other].slice(0,3)]);
    const q={w,t,opts};
    if(t==="spell"){q.tiles=shuffle(w.en.split("").map(ch=>({ch})));q.used=[]}
    else{const S=sentenceFor(w);q.s=S.en;q.st=S.th}
    return q;
  });
}
/* บันทึกข้อสอบที่ทำค้างไว้ทุกข้อ ปิดแอปแล้วกลับมาทำต่อได้ */
const packQ=q=>({w:WK(q.w),t:q.t,o:q.opts.map(WK),s:q.s||"",ti:q.tiles?q.tiles.map(x=>x.ch).join(""):""});
function unpackQ(p){
  const q={w:WMAP.get(p.w),t:p.t,opts:(Array.isArray(p.o)?p.o:[]).map(k=>WMAP.get(k))};
  if(!q.w||q.opts.length!==4||q.opts.some(x=>!x))throw new Error("bad question");
  if(q.t==="spell"){q.tiles=String(p.ti||"").split("").map(ch=>({ch}));q.used=[];if(q.tiles.length!==q.w.en.length)throw new Error("bad tiles")}
  else{q.t="sentence";const S=sentenceFor(q.w);q.s=S.en;q.st=S.th}
  return q;
}
function saveProgress(){
  const v=view;if(v.name!=="quiz")return;
  const d=kids[v.kid];
  d.resume={i:v.i,practice:!!v.practice,weekly:v.weekly||null,qs:v.qs.map(packQ),n:v.n,ok:v.ok,missed:v.missed.map(WK),t:Date.now()};
  writeDoc("kids/"+v.kid,d);
}
function beginQuiz(base,pool,pick){
  view={name:"quiz",...base,qs:makeQuiz(pool,pick),n:0,ok:0,missed:[],answered:null};
  saveProgress();render();window.scrollTo(0,0);
}
function startQuiz(practice){
  const ws=lessonWords(view.i);
  beginQuiz({kid:view.kid,i:view.i,practice,weekly:null},ws,practice?shuffle(ws).slice(0,10):shuffle(ws));
}
function startWeekly(){
  const id=view.kid,d=kids[id],key=weeklyDue(d);
  if(!key){toast("ตอนนี้ยังไม่มีสอบรอบยอด");return}
  const pool=passedWords(d);
  beginQuiz({kid:id,i:-1,practice:false,weekly:key},pool,weeklyPick(d,key,pool));
}
function resumeQuiz(id){
  const r=kids[id].resume;
  try{
    if(!r||!Array.isArray(r.qs)||!r.qs.length)throw new Error("none");
    const qs=r.qs.map(unpackQ), n=Math.max(0,Math.min(qs.length-1,+r.n||0));
    view={name:"quiz",kid:id,i:+r.i,practice:!!r.practice,weekly:r.weekly||null,qs,n,ok:Math.max(0,+r.ok||0),
      missed:(Array.isArray(r.missed)?r.missed:[]).map(k=>WMAP.get(k)).filter(Boolean),answered:null};
    render();window.scrollTo(0,0);
  }catch(e){
    kids[id].resume=null;writeDoc("kids/"+id,kids[id]);
    toast("เปิดข้อสอบที่ค้างไว้ไม่ได้ เริ่มใหม่ได้เลย");go({name:"kid",kid:id});
  }
}
function quizLabel(v){return v.weekly?"📝 สอบรอบยอด":v.practice?"🎯 ฝึก":"📝 สอบ"}
function vQuiz(){
  const q=view.qs[view.n], w=q.w, total=view.qs.length, a=view.answered;
  let body="";
  const first=q.t==="sentence"&&q.s.startsWith("___");
  const ansWord=first?w.en.charAt(0).toUpperCase()+w.en.slice(1):w.en;
  const full=q.t==="sentence"?q.s.replace("___",ansWord):w.en;
  const hear=`<button class="speak sm" data-act="say" data-w="${esc(full)}" aria-label="ฟังเสียง">🔊</button>`;
  const fb=a==null?"":`<div class="row" style="justify-content:center">${a.ok?`<div class="feedback ok pop">เก่งมาก! ✔</div>`:`<div class="feedback no">คำตอบคือ <b class="en">${esc(w.en)}</b> = ${esc(w.th)} ${w.em}</div>`}${hear}</div>`;
  const optCls=o=>a==null?"":o===w?"right":(a.pick===o?"wrong":"");
  if(q.t==="sentence"){
    const s=esc(q.s).replace("___",a?`<u>${esc(ansWord)}</u>`:`<span class="blank"></span>`);
    body=`<div class="ask">อ่านประโยค แล้วเลือกคำที่หายไป</div><div class="emo">${w.em}</div><div class="sent en">${s}</div>
    <div class="sent-th">${esc(q.st)}</div>
    <div class="opts">${q.opts.map((o,ix)=>`<button class="opt en ${optCls(o)}" data-act="pick" data-ix="${ix}">${esc(o.en)}</button>`).join("")}</div>`;
  }else{
    const built=q.used.map(u=>q.tiles[u].ch);
    body=`<div class="ask">เรียงตัวอักษรให้เป็นคำ</div><div class="emo">${w.em}</div><div class="row" style="justify-content:center"><div class="big" style="font-size:28px">${esc(w.th)}</div><button class="speak" data-act="say" data-w="${esc(w.en)}" aria-label="ฟังเสียง">🔊</button></div>
    <div class="slots">${w.en.split("").map((_,ix)=>`<button class="slot ${built[ix]?"f":""}" data-act="unspell" data-ix="${ix}" ${a?"disabled":""}>${built[ix]?esc(built[ix]):""}</button>`).join("")}</div>
    ${a?"":`<div class="tiles">${q.tiles.map((t,ix)=>`<button class="tile ${q.used.includes(ix)?"used":""}" data-act="spell" data-ix="${ix}">${esc(t.ch)}</button>`).join("")}</div>`}`;
  }
  return `<div class="top"><button class="back" data-act="quit">✕ พักไว้ก่อน</button>
    <div class="row" style="flex:1;justify-content:flex-end"><div class="progress"><i style="width:${(view.n+(a?1:0))/total*100}%"></i></div><span class="pill">${view.n+1}/${total}</span>

  ${a&&!a.ok?`<div class="bar"><div class="in"><button class="btn main" data-act="nextq">ข้อต่อไป →</button></div></div>`:""}`;
}
function answer(ok,pick){
  const q=view.qs[view.n];
  view.answered={ok,pick};
  if(ok){view.ok++;beep(true);render();setTimeout(nextQ,950)}
  else{view.missed.push(q.w);beep(false);render();setTimeout(()=>say(q.w.en),350)}
}
function nextQ(){
  if(view.name!=="quiz"||!view.answered)return;
  view.answered=null;view.n++;
  if(view.n>=view.qs.length){finishQuiz();return}
  saveProgress();render();
}
function finishQuiz(){
  const total=view.qs.length, pct=Math.round(view.ok/total*100), pass=pct>=PASS;
  const id=view.kid, i=view.i, wk=view.weekly, d=kids[id];
  const res={name:"result",kid:id,i,practice:view.practice,weekly:wk,pct,ok:view.ok,total,missed:view.missed,pass};
  d.resume=null;
  if(!view.practice){
    const at={l:wk?-1:i,p:pct,c:view.ok,n:total,t:Date.now(),m:view.missed.map(w=>w.en)};
    if(wk)at.w=wk;
    d.attempts.push(at);
    if(d.attempts.length>200)d.attempts=d.attempts.slice(-200);
    view.missed.forEach(w=>{d.missed[w.en]=(+d.missed[w.en]||0)+1});
    if(wk){
      const prev=d.weekly[wk]||{};
      d.weekly[wk]={best:Math.max(+prev.best||0,pct),tries:(+prev.tries||0)+1,passed:prev.passed||(pass?today():null)};
    }else{
      d.best[i]=Math.max(+d.best[i]||0,pct);
      const st=starsFor(pct);if(st>(+d.stars[i]||0))d.stars[i]=st;
      if(pass&&!d.passed[i])d.passed[i]=today();
    }
  }
  if(!d.days.includes(today()))d.days.push(today());
  if(d.days.length>120)d.days=d.days.slice(-120);
  d.last=Date.now();
  writeDoc("kids/"+id,d);
  view=res;render();window.scrollTo(0,0);
  if(!res.practice&&pass)setTimeout(()=>{beep(true);setTimeout(()=>beep(true),250)},200);
}
function vResult(){

    btns=review+(due?`<button class="btn main" data-act="weekly">📝 สอบรอบยอด</button>`

    if(act==="pick"){const o=q.opts[+b.dataset.ix];answer(o===q.w,o);return}
    if(act==="spell"){const ix=+b.dataset.ix;if(q.used.includes(ix))return;q.used.push(ix);
      if(q.used.length===q.w.en.length){const word=q.used.map(u=>q.tiles[u].ch).join("");answer(word===q.w.en,null)}else render();return}
    if(act==="unspell"){const ix=+b.dataset.ix;if(ix<q.used.length){q.used.splice(ix);render()}return}
  }
});
document.addEventListener("submit",e=>{
  if(e.target.id!=="gate-form")return;e.preventDefault();
  const v=+$("#gate-ans").value;
  if(v===view.a*view.b)go({name:"dash"});else{toast("ยังไม่ถูก ลองใหม่");view.a=null;render()}
});
document.addEventListener("change",e=>{
  if(e.target.id==="daily-limit"){settings={dailyLimit:e.target.checked};writeDoc("settings/main",settings);toast(settings.dailyLimit?"เปิดบทใหม่วันละบท":"สอบผ่านแล้วเรียนบทถัดไปได้ทันที")}
});

render();
initStore();
</script>

<script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script>
